model:
  input_dim: 10
  output_dim: 1
  hidden_dim: 64
  num_layers: 3
  aggregation: "sum"
  layer_type: "GCNConv"
  activation: "relu"
  dropout: 0.2


train:
  train_data_path: "test/Cora_train.pt"
  model_save_path: "out/GNN_Cora.pt"
  batch_size: 32
  num_epochs: 100
  loss_function: "MSELoss"
  optimizer:
    type: "Adam"
    learning_rate: 0.001


evaluate:
  eval_data_path: "path/to/eval/data"
  batch_size: 32
  loss_function: "MSELoss"
  model_load_path: "gnn_model.pth"